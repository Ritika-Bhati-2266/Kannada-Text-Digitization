# One-service deployment: FastAPI serves both the API and the built frontend (frontend/dist).
# Add GEMINI_API_KEY (or GROQ_API_KEY) in the Render dashboard after creating the service.
services:
  - type: web
    name: kannada-lipi-mitra
    runtime: python
    plan: free
    buildCommand: >
      sudo apt-get update -qq &&
      sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kann &&
      pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: OCR_ENGINE
        value: groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /api/health

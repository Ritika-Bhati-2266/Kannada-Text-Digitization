# One-service deployment: Docker image (see Dockerfile) — FastAPI serves
# both the API and the built frontend (frontend/dist baked into the image).
# Tesseract + Kannada data (kan) are installed inside the Dockerfile.
services:
  - type: web
    name: kannada-lipi-mitra
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OCR_ENGINE
        value: tesseract
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /api/health
